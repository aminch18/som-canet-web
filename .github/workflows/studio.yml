name: Build Sanity Studio
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanity-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Package configured Studio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require a real Sanity project
        run: node -e "if (!process.env.SANITY_STUDIO_PROJECT_ID) throw new Error('Configure the SANITY_PROJECT_ID repository variable before building Studio.')"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run studio:build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sanity-studio-${{ github.run_id }}
          path: studio/dist
          if-no-files-found: error
          retention-days: 7
