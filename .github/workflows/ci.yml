name: Checks
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CONTENT_SOURCE: local
      PUBLIC_INDEXABLE: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure GitHub Pages paths
        shell: bash
        run: node scripts/github-pages-env.mjs
      - uses: ./.github/actions/verify
      - name: Save review build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-review-${{ github.run_id }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
